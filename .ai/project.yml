# The way-of-working plugin's parameterization contract for this repo
# (claude-workbench plugins/way-of-working/reference/project-schema.md, v0.28.0).
# Describes the repo as of 2026-10-28. `identities` is now the map
# (glunk-works/claude-workbench#410 PR 1); `orchestration` stays null.

# ── identity ─────────────────────────────────────────────────────────────────
repo: glunk-works/scope-core
pr_base: main
migration_base: null

# ── the deep record ──────────────────────────────────────────────────────────
roadmap: docs/decisions.md
sprints_dir: sprints
threat_model: docs/decisions.md

planning:
  kind: github_milestones

decisions:
  log: docs/decisions.md
  prefix: SC-D

backlog:
  kind: github_issues
  repo: null
  path: null
  item_prefix: null

load_bearing_docs:
  - README.md
  - docs/decisions.md

# ── what counts as a behavior change ─────────────────────────────────────────
code_paths:
  - scope_core/
  - tests/
  - pyproject.toml
  - .github/workflows/

# ── the local green gate ─────────────────────────────────────────────────────
gates:
  green:
    - { run: hatch run lint:check }
    - { run: hatch run test:run }

# ── branch protection ────────────────────────────────────────────────────────
ruleset:
  name: main-required-checks
  rule_types: [required_status_checks]
  required_checks: [lint, test, test-py314, architect-review]
rulesets:
  - name: main-required-checks
    source: repo
    rule_types: [required_status_checks]
    required_checks: [lint, test, test-py314, architect-review]
  - name: protected-integration-branches
    source: repo
    rule_types: [deletion, non_fast_forward, pull_request]

# ── the fresh-session review gate ────────────────────────────────────────────
review:
  ci_gate:
    check: architect-review
    header: "**Opus/Architect review (automated)**"
    attestation: "*Fresh-session review: this session did not author the diff.*"
    triggers_on: null # null means code_paths; a PR touching nothing under code_paths is not gated.

# ── agents ───────────────────────────────────────────────────────────────────
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
  diff_rule: null
models:
  architect: opus
  coder: sonnet
  second_opinion: null

# ── the sprint-orchestrator loop ─────────────────────────────────────────────
orchestration: null

# ── declared identities ──────────────────────────────────────────────────────
identities:
  maintainer:
    - {login: Seuss27, id: 22668449}
  dev_app:
    login: "glunk-dev[bot]"
    id: 339840170
  reviewer_app:
    login: "glunk-review[bot]"
    id: 339841158
  loop_app:
    login: "glunk-loop[bot]"
    id: 338193635
